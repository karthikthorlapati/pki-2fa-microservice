version: '3.8'

services:
  vault_core:
    build: .
    ports:
      - "8080:8080"
    volumes:
      # Persistent storage for the decrypted seed
      # Maps local volume 'vault_storage' to container path '/vault_data'
      - vault_storage:/vault_data
      
      # Persistent storage for audit logs
      # Maps local volume 'audit_logs' to container path '/vault_logs'
      - audit_logs:/vault_logs
      
      # Mount the Identity Keys (Read Only)
      # Must match the filenames generated by utilities/identity_gen.py
      - ./identity_secret.pem:/app/identity_secret.pem:ro
      - ./identity_public.pem:/app/identity_public.pem:ro
    environment:
      - TZ=UTC

volumes:
