version: '3.8'

services:
  vault_core:
    build: .
    ports:
      - "8080:8080"
    volumes:
      # CRITICAL: Map to /data for seed persistence
      - seed-data:/data
      
      # CRITICAL: Map to /cron for log persistence
      - cron-output:/cron
      
      # Map Keys (Renamed to match requirements)
      - ./student_private.pem:/app/student_private.pem:ro
      - ./student_public.pem:/app/student_public.pem:ro
      # Ensure you have the instructor key locally
      - ./instructor_public.pem:/app/instructor_public.pem:ro
    environment:
      - TZ=UTC

volumes:
  seed-data:
  cron-output: